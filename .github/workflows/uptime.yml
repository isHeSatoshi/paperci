# External dead-man's switch for the cloud agent. Runs outside AWS, so it still fires if the whole server is gone.
# A failed run makes GitHub email the repository owner. Read-only: it only GETs the public health endpoint.
#
# Retired 2026-10-16: the cloud window (2026-10-11 until 2026-10-16 23:59 IST) has closed and the EC2 agent is
# intentionally off, so the 30-minute schedule was removed. Otherwise every run emails a failure for a service
# that is supposed to be silent. Dispatch it by hand (Actions -> paperci-uptime -> Run workflow) if the agent is
# brought back up; restore the schedule block below at the same time.
#   schedule:
#     - cron: "*/30 * * * *"
name: paperci-uptime
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Check the agent is alive (web up, worker beating, watchdog running)
        run: |
          # the server powers itself off at 2026-10-16 18:29 UTC; after that silence is expected
          [ "$(date -u +%s)" -gt "$(date -u -d '2026-10-16 18:35' +%s)" ] && { echo "credit window over"; exit 0; }
          for i in 1 2 3; do
            body=$(curl -s -m 20 -w '\n%{http_code}' https://paperci.vercel.app/healthz) && code=$(echo "$body" | tail -n1)
            echo "$body"
            [ "$code" = "200" ] && echo "$body" | head -n1 | python3 -c "import json,sys; d=json.load(sys.stdin); a=d.get('watchdog_age_s'); sys.exit(0 if a is None or a < 900 else 1)" && exit 0
            sleep 60
          done
          echo "::error::PaperCI agent unhealthy (web down, worker hung, or watchdog silent)"
          exit 1
