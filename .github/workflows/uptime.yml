# External dead-man's switch for the cloud agent. Runs outside AWS, so it still fires if the whole server is gone.
# Read-only: it only GETs the public health endpoint.
#
# Retired 2026-10-16. The cloud window ran 2026-10-11 until 2026-10-16 23:59 IST. The EC2 agent is off and the
# hackathon AWS credentials have been deactivated (InvalidClientTokenId), so the endpoint this probes no longer
# answers. The 30-minute schedule was removed: it emailed a failure on every run for a service that is supposed to
# be silent. The probe is informational now, it reports what it finds and always passes.
#
# To revive: start the agent again, then make the probe fail on a bad status and restore the schedule block:
#   schedule:
#     - cron: "*/30 * * * *"
name: paperci-uptime
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Probe the agent endpoint (informational)
        run: |
          body=$(curl -s -m 25 -w '\n%{http_code}' https://paperci.vercel.app/healthz || true)
          code=$(echo "$body" | tail -n1)
          echo "$body"
          if [ "$code" = "200" ]; then
            echo "$body" | head -n1 | python3 -c "import json,sys; print('agent healthy, watchdog_age_s=%s' % json.load(sys.stdin).get('watchdog_age_s'))" || true
          else
            echo "::notice::Agent endpoint unreachable (HTTP $code). Expected: the cloud window closed 2026-10-16."
          fi
