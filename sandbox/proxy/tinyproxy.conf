User tinyproxy
Group tinyproxy
Port 8888
Listen 0.0.0.0
Timeout 900
MaxClients 64
LogLevel Connect
# Only the allowlisted hosts are reachable; everything else gets 403 "Filtered".
FilterDefaultDeny Yes
FilterType ere
FilterURLs Off
Filter "/etc/tinyproxy/allowlist"
ConnectPort 443
ConnectPort 80
DisableViaHeader Yes
